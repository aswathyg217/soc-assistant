{% extends "base.html" %}
{% block body %}
<h1>Incidents — tenant {{ tenant }}</h1>
<div class="card">
<table>
<tr><th>Incident</th><th>Title</th><th>Status</th><th>Ver</th><th>Pending approvals</th></tr>
{% for i in incidents %}
<tr>
  <td><a href="{{ url_for('incident', incident_id=i.id) }}">{{ i.id }}</a></td>
  <td>{{ i.title }}</td>
  <td><span class="pill {{ i.status }}">{{ i.status }}</span></td>
  <td>{{ i.version }}</td>
  <td>{% if pending.get(i.id) %}<b>{{ pending[i.id] }}</b>{% else %}—{% endif %}</td>
</tr>
{% endfor %}
</table>
</div>
{% endblock %}
