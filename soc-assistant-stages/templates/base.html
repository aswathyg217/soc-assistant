<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>SOC Analyst Console</title>
<style>
  :root{--navy:#14213d;--amber:#e8a33d;--teal:#2f7d6e;--red:#c0512f;--bg:#fbfbf8;--line:#e3e6e4}
  *{box-sizing:border-box} body{margin:0;font:15px/1.5 system-ui,Segoe UI,Arial;color:#1a2238;background:var(--bg)}
  header{background:var(--navy);color:#fff;padding:14px 22px;display:flex;gap:18px;align-items:center}
  header a{color:#cfe;text-decoration:none;font-weight:600} header .t{font-weight:700;font-size:18px;margin-right:auto}
  main{max-width:1000px;margin:22px auto;padding:0 18px}
  .card{background:#fff;border:1px solid var(--line);border-radius:10px;padding:16px 18px;margin:0 0 16px}
  h1{font-size:22px;margin:.2em 0}.muted{color:#667}
  table{width:100%;border-collapse:collapse;font-size:14px}th,td{text-align:left;padding:7px 9px;border-bottom:1px solid var(--line);vertical-align:top}
  th{color:#556;font-weight:600}
  .pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600}
  .open{background:#fdecef;color:#a3283e}.closed{background:#e8f0ec;color:#1f5a4e}.escalated{background:#fdf0dd;color:#8a5a12}
  .contained{background:#eef2fb;color:#2b3c6b}.active{background:#fdecef;color:#a3283e}
  .btn{border:0;border-radius:7px;padding:7px 14px;font-weight:600;cursor:pointer;color:#fff}
  .ok{background:var(--teal)}.danger{background:var(--red)}
  code,pre{background:#f4f4f0;border-radius:5px;padding:1px 5px;font-size:13px}
  pre{padding:10px;overflow:auto}
  .flash{padding:10px 14px;border-radius:8px;margin:0 0 14px}.flash.ok{background:#e8f0ec;color:#1f5a4e}.flash.err{background:#fdecef;color:#a3283e}
  .deny{color:var(--red);font-weight:600}.allow{color:var(--teal);font-weight:600}.appr{color:#8a5a12;font-weight:600}
</style></head>
<body>
<header>
  <span class="t">SOC Analyst Console</span>
  <a href="{{ url_for('incidents') }}">Incidents</a>
  <a href="{{ url_for('audit') }}">Audit</a>
  <span class="muted" style="color:#9fb">local-demo — not production auth</span>
</header>
<main>
  {% with msgs = get_flashed_messages(with_categories=true) %}
    {% for cat,msg in msgs %}<div class="flash {{ cat }}">{{ msg }}</div>{% endfor %}
  {% endwith %}
  {% block body %}{% endblock %}
</main>
</body></html>
