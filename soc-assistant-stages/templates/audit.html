{% extends "base.html" %}
{% block body %}
<h1>Audit history</h1>
<div class="card">
<table><tr><th>actor</th><th>tool</th><th>outcome</th><th>rule</th><th>reason</th><th>action</th></tr>
{% for a in audit %}
<tr><td>{{ a.actor }}</td><td><code>{{ a.tool }}</code></td>
  <td class="{{ 'deny' if a.outcome=='deny' else 'appr' if a.outcome=='require_approval' else 'allow' }}">{{ a.outcome }}</td>
  <td>{{ a.rule }}</td><td>{{ a.reason }}</td><td>{{ a.action_id or '' }}</td></tr>
{% endfor %}
</table>
</div>
{% endblock %}
